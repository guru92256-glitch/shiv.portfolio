  <!-- Glowing Center Pin -->
  <circle cx="32" cy="32" r="3" fill="#00f0ff" />
  <circle cx="42" cy="24" r="2" fill="#ffffff" />
  <circle cx="22" cy="38" r="2" fill="#00f0ff" />
