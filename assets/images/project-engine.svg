<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a4b60"/>
      <stop offset="50%" stop-color="#8ba1bc"/>
      <stop offset="100%" stop-color="#243346"/>
    </linearGradient>
    <linearGradient id="redPipes" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <pattern id="gridE" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#131e2e" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgE)"/>
  <rect width="100%" height="100%" fill="url(#gridE)" opacity="0.8"/>

  <rect x="50" y="35" width="220" height="28" rx="4" fill="#0d1b2a" stroke="#00f0ff" stroke-width="1"/>
  <text x="60" y="54" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">POWERTRAIN // 4.0L TWIN-TURBO V8</text>
  <text x="750" y="54" fill="#ff4466" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">750 HP // 9,000 RPM REDLINE</text>

  <!-- Engine Block V-Configuration -->
  <g transform="translate(400, 260)">
    <!-- Crankcase base -->
    <path d="M-110 130 L110 130 L130 90 L-130 90 Z" fill="#131d2b" stroke="#3a567c" stroke-width="2.5"/>
    <rect x="-90" y="130" width="180" height="30" rx="6" fill="#0a1017" stroke="#24374f" stroke-width="2"/>
    <circle cx="0" cy="110" r="28" fill="#06090e" stroke="#00f0ff" stroke-width="2.5"/>
    <circle cx="0" cy="110" r="10" fill="#00f0ff"/>

    <!-- Cylinder Bank Left (90 degree V) -->
    <g transform="rotate(-45, 0, 90)">
      <rect x="-60" y="-120" width="120" height="180" rx="8" fill="#101a26" stroke="#00f0ff" stroke-width="3"/>
      <!-- Cylinders 1-3-5-7 -->
      <circle cx="0" cy="-80" r="32" fill="#080e14" stroke="#ff5500" stroke-width="2"/>
      <circle cx="0" cy="-80" r="22" fill="#ff5500" opacity="0.2"/>
      <circle cx="0" cy="-20" r="32" fill="#080e14" stroke="#ff5500" stroke-width="2"/>
      <circle cx="0" cy="-20" r="22" fill="#ff5500" opacity="0.2"/>
      <circle cx="0" cy="40" r="32" fill="#080e14" stroke="#ff5500" stroke-width="2"/>
      <!-- Valve Cover -->
      <rect x="-66" y="-140" width="132" height="25" rx="5" fill="#e60026" stroke="#ff3344" stroke-width="2"/>
      <text x="0" y="-123" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="bold">DOHC 16-VALVE</text>
    </g>

    <!-- Cylinder Bank Right -->
    <g transform="rotate(45, 0, 90)">
      <rect x="-60" y="-120" width="120" height="180" rx="8" fill="#101a26" stroke="#00f0ff" stroke-width="3"/>
      <circle cx="0" cy="-80" r="32" fill="#080e14" stroke="#ff5500" stroke-width="2"/>
      <circle cx="0" cy="-80" r="22" fill="#ff5500" opacity="0.2"/>
      <circle cx="0" cy="-20" r="32" fill="#080e14" stroke="#ff5500" stroke-width="2"/>
      <circle cx="0" cy="-20" r="22" fill="#ff5500" opacity="0.2"/>
      <circle cx="0" cy="40" r="32" fill="#080e14" stroke="#ff5500" stroke-width="2"/>
      <rect x="-66" y="-140" width="132" height="25" rx="5" fill="#e60026" stroke="#ff3344" stroke-width="2"/>
      <text x="0" y="-123" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="bold">DOHC 16-VALVE</text>
    </g>

    <!-- Intake Plenum & Runner System in V-Valley -->
    <path d="M-70 -20 Q0 -60 70 -20 L50 20 L-50 20 Z" fill="#18273a" stroke="#00f0ff" stroke-width="2"/>
    <ellipse cx="0" cy="-35" rx="35" ry="18" fill="#0a121c" stroke="#00f0ff" stroke-width="2"/>
    <text x="0" y="-31" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">CARBON PLENUM</text>

    <!-- Left & Right Turbochargers -->
    <!-- Left Turbo -->
    <g transform="translate(-190, -40)">
      <path d="M0 0 A35 35 0 1 1 35 -35 L45 -20 A45 45 0 1 0 0 10 Z" fill="#203045" stroke="#ff8800" stroke-width="2"/>
      <circle cx="0" cy="0" r="20" fill="#090e15" stroke="#ff8800" stroke-width="2"/>
      <path d="M-8 -8 L8 8 M-8 8 L8 -8" stroke="#ff8800" stroke-width="2"/>
      <!-- Exhaust pipe -->
      <path d="M25 -30 C30 -80 70 -90 100 -80" fill="none" stroke="url(#redPipes)" stroke-width="6"/>
      <text x="-5" y="45" fill="#ff8800" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">TURBO-L</text>
    </g>

    <!-- Right Turbo -->
    <g transform="translate(190, -40)">
      <path d="M0 0 A35 35 0 1 0 -35 -35 L-45 -20 A45 45 0 1 1 0 10 Z" fill="#203045" stroke="#ff8800" stroke-width="2"/>
      <circle cx="0" cy="0" r="20" fill="#090e15" stroke="#ff8800" stroke-width="2"/>
      <path d="M-8 -8 L8 8 M-8 8 L8 -8" stroke="#ff8800" stroke-width="2"/>
      <!-- Exhaust pipe -->
      <path d="M-25 -30 C-30 -80 -70 -90 -100 -80" fill="none" stroke="url(#redPipes)" stroke-width="6"/>
      <text x="5" y="45" fill="#ff8800" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">TURBO-R</text>
    </g>
  </g>

  <!-- Technical Details Callout -->
  <text x="50" y="475" fill="#446182" font-family="'JetBrains Mono', monospace" font-size="10">PARAMETRIC ASSEMBLY // DRY-SUMP LUBRICATION // SOLIDWORKS CAD</text>
</svg>
