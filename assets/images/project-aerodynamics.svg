<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="100%" stop-color="#020407"/>
    </linearGradient>
    <linearGradient id="cfdVel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0055ff"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="65%" stop-color="#00ff66"/>
      <stop offset="85%" stop-color="#ffdd00"/>
      <stop offset="100%" stop-color="#ff2200"/>
    </linearGradient>
    <pattern id="gridA" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#0f1926" stroke-width="0.7"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgAero)"/>
  <rect width="100%" height="100%" fill="url(#gridA)" opacity="0.8"/>

  <!-- Telemetry Header -->
  <rect x="40" y="30" width="250" height="28" rx="4" fill="#0d1b2a" stroke="#00f0ff" stroke-width="1"/>
  <text x="50" y="49" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CFD SIMULATION // AEROFOIL WING</text>
  <text x="760" y="49" fill="#00ff88" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">CL: -2.48 // DOWNFORCE: 680 N @ 100 KM/H</text>

  <!-- CFD Velocity Legend -->
  <g transform="translate(620, 100)">
    <text x="0" y="-10" fill="#8fa0b5" font-family="'JetBrains Mono', monospace" font-size="9">AIR VELOCITY (M/S)</text>
    <rect x="0" y="0" width="140" height="12" rx="3" fill="url(#cfdVel)"/>
    <text x="0" y="24" fill="#5a7a9a" font-family="'JetBrains Mono', monospace" font-size="8">0 m/s</text>
    <text x="70" y="24" fill="#5a7a9a" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">28 m/s</text>
    <text x="140" y="24" fill="#5a7a9a" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">55 m/s</text>
  </g>

  <!-- Multi-Element High Downforce Aerofoil Wing Cross-Section -->
  <g transform="translate(380, 260) scale(1.1)">
    <!-- Main Inverted Aerofoil Plane -->
    <path d="M-180 -20 
             C-140 -50 -20 -40 120 10 
             C80 25 -40 30 -140 10 
             C-170 5 -190 0 -180 -20 Z" 
          fill="#132238" stroke="#00f0ff" stroke-width="3"/>
    
    <!-- Secondary Flap Element (Inverted for Downforce) -->
    <path d="M100 -5 
             C150 -35 220 15 260 50 
             C210 50 160 40 110 15 Z" 
          fill="#182c48" stroke="#00ff88" stroke-width="2.5"/>

    <!-- Gurney Flap at Trailing Edge -->
    <line x1="260" y1="50" x2="260" y2="70" stroke="#ff3344" stroke-width="3"/>

    <!-- Wing Endplate Outline -->
    <path d="M-220 -80 L280 -80 L300 110 L-200 110 Z" fill="none" stroke="#253e5e" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="50" y="100" fill="#4a6e96" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">CARBON FIBRE ENDPLATE CONTOUR</text>
  </g>

  <!-- CFD Streamlines Airflow passing over & under wing -->
  <g fill="none" opacity="0.85">
    <!-- Fast airflow underneath (creating suction/downforce) -->
    <path d="M50 160 C200 160 300 140 450 180 S700 280 760 300" stroke="#ff3300" stroke-width="2.5" stroke-dasharray="16,8"/>
    <path d="M50 190 C180 190 280 180 430 220 S680 320 760 330" stroke="#ff9900" stroke-width="2.5" stroke-dasharray="20,10"/>
    <path d="M50 220 C180 220 270 230 420 260 S660 340 760 350" stroke="#00ff88" stroke-width="2" stroke-dasharray="15,6"/>
    
    <!-- Top airflow -->
    <path d="M50 120 C220 120 330 80 500 100 S700 180 760 210" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="12,6"/>
    <path d="M50 80 C240 80 380 50 540 70 S720 130 760 160" stroke="#0066ff" stroke-width="2" stroke-dasharray="16,8"/>
    
    <!-- Vortex wake at trailing edge -->
    <circle cx="700" cy="270" r="16" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="715" cy="290" r="24" stroke="#ff5500" stroke-width="1.5" stroke-dasharray="5,5"/>
  </g>

  <!-- Ground Proximity Line -->
  <line x1="50" y1="420" x2="750" y2="420" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="400" y="445" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">GROUND EFFECT CLEARANCE: h = 65 mm</text>
  <text x="50" y="480" fill="#415d80" font-family="'JetBrains Mono', monospace" font-size="10">ANSYS FLUENT &amp; OPENFOAM // HIGH DOWNFORCE FORMULA STUDENT STUDY</text>
</svg>
