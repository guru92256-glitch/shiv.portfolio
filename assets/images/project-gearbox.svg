<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d15"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="gearGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
    <linearGradient id="gearCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <pattern id="gridG" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#101c2b" stroke-width="0.8"/>
    </pattern>
    <filter id="glowG">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgG)"/>
  <rect width="100%" height="100%" fill="url(#gridG)" opacity="0.9"/>

  <!-- Technical Telemetry Header -->
  <rect x="50" y="35" width="220" height="28" rx="4" fill="#0d1b2a" stroke="#ff8800" stroke-width="1"/>
  <text x="60" y="54" fill="#ff9900" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">KINEMATICS // SPUR GEAR TRAIN</text>
  <text x="750" y="54" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">RATIO: 3.42:1 // 98.4% EFFICIENCY</text>

  <!-- Large Driving Gear (Left) -->
  <g transform="translate(270, 260)">
    <!-- Outer Gear Circle with Teeth -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1d304a" stroke-width="2"/>
    <circle cx="0" cy="0" r="130" fill="#0c1524" stroke="url(#gearCyan)" stroke-width="4" filter="url(#glowG)"/>
    <circle cx="0" cy="0" r="85" fill="#060b12" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8,5"/>
    
    <!-- Gear Teeth representation -->
    <g stroke="url(#gearCyan)" stroke-width="6">
      <line x1="0" y1="-142" x2="0" y2="-126"/>
      <line x1="0" y1="126" x2="0" y2="142"/>
      <line x1="-142" y1="0" x2="-126" y2="0"/>
      <line x1="126" y1="0" x2="142" y2="0"/>
      <line x1="-100" y1="-100" x2="-89" y2="-89"/>
      <line x1="89" y1="89" x2="100" y2="100"/>
      <line x1="-100" y1="100" x2="-89" y2="89"/>
      <line x1="89" y1="-89" x2="100" y2="-100"/>
      <line x1="-131" y1="-54" x2="-117" y2="-48"/>
      <line x1="117" y1="48" x2="131" y2="54"/>
      <line x1="-54" y1="-131" x2="-48" y2="-117"/>
      <line x1="48" y1="117" x2="54" y2="131"/>
      <line x1="131" y1="-54" x2="117" y2="-48"/>
      <line x1="-117" y1="48" x2="-131" y2="54"/>
      <line x1="54" y1="-131" x2="48" y2="-117"/>
      <line x1="-48" y1="117" x2="-54" y2="131"/>
    </g>

    <!-- Spokes -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#00f0ff" stroke-width="4"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#00f0ff" stroke-width="4"/>
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#00f0ff" stroke-width="3"/>
    <line x1="-50" y1="50" x2="50" y2="-50" stroke="#00f0ff" stroke-width="3"/>

    <!-- Keyway & Shaft Bore -->
    <circle cx="0" cy="0" r="30" fill="#05080e" stroke="#00f0ff" stroke-width="2.5"/>
    <rect x="-6" y="-36" width="12" height="12" fill="#05080e" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#00f0ff"/>
    
    <!-- Direction of Rotation Arrow -->
    <path d="M-55 -40 A68 68 0 0 1 40 -55" fill="none" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="0" y="-75" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ω1 = 3,000 RPM</text>
  </g>

  <!-- Driven Pinion Gear (Right) - Meshing Teeth -->
  <g transform="translate(490, 260)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#36220a" stroke-width="2"/>
    <circle cx="0" cy="0" r="88" fill="#171008" stroke="url(#gearGold)" stroke-width="4" filter="url(#glowG)"/>
    <circle cx="0" cy="0" r="56" fill="#090502" stroke="#ff8800" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Pinion teeth -->
    <g stroke="url(#gearGold)" stroke-width="5.5">
      <line x1="0" y1="-96" x2="0" y2="-84"/>
      <line x1="0" y1="84" x2="0" y2="96"/>
      <line x1="-96" y1="0" x2="-84" y2="0"/>
      <line x1="84" y1="0" x2="96" y2="0"/>
      <line x1="-68" y1="-68" x2="-59" y2="-59"/>
      <line x1="59" y1="59" x2="68" y2="68"/>
      <line x1="-68" y1="68" x2="-59" y2="59"/>
      <line x1="59" y1="-59" x2="68" y2="-68"/>
    </g>

    <line x1="-45" y1="0" x2="45" y2="0" stroke="#ff8800" stroke-width="3"/>
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#ff8800" stroke-width="3"/>
    
    <circle cx="0" cy="0" r="22" fill="#060402" stroke="#ff8800" stroke-width="2"/>
    <rect x="-4" y="-27" width="8" height="9" fill="#060402" stroke="#ff8800" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#ffaa00"/>

    <text x="0" y="-55" fill="#ffaa00" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ω2 = 877 RPM</text>
  </g>

  <!-- Pitch Circle Contact Pitch Line -->
  <line x1="395" y1="130" x2="395" y2="390" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="395" cy="260" r="5" fill="#ff0055" filter="url(#glowG)"/>
  <text x="405" y="255" fill="#ff0055" font-family="'JetBrains Mono', monospace" font-size="9">PITCH POINT P</text>

  <!-- Dimension Annotation -->
  <line x1="270" y1="420" x2="490" y2="420" stroke="#5a7a9a" stroke-width="1"/>
  <line x1="270" y1="412" x2="270" y2="428" stroke="#5a7a9a" stroke-width="1"/>
  <line x1="490" y1="412" x2="490" y2="428" stroke="#5a7a9a" stroke-width="1"/>
  <text x="380" y="438" fill="#8fa0b5" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">CENTER DISTANCE: a = 220.00 mm</text>

  <text x="50" y="475" fill="#446182" font-family="'JetBrains Mono', monospace" font-size="10">FEA STRESS CONCENTRATION // INVOLUTE PROFILE // MECHANICAL SYNTHESIS</text>
</svg>
