<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="50%" stop-color="#ffa751"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>
    <linearGradient id="purpleNeon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgB)"/>
  
  <!-- Geometric Editorial Layout Elements -->
  <line x1="50" y1="40" x2="750" y2="40" stroke="#2e1065" stroke-width="1.5"/>
  <line x1="50" y1="460" x2="750" y2="460" stroke="#2e1065" stroke-width="1.5"/>
  <line x1="400" y1="40" x2="400" y2="460" stroke="#2e1065" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Gold Medal Badge Top Right -->
  <g transform="translate(680, 80)">
    <circle cx="0" cy="0" r="28" fill="#1e1305" stroke="url(#gold)" stroke-width="2.5"/>
    <text x="0" y="-4" fill="#ffd700" font-family="'JetBrains Mono', monospace" font-size="16" text-anchor="middle">🏅</text>
    <text x="0" y="16" fill="#ffe259" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" font-weight="bold">GOLD MEDAL</text>
  </g>

  <!-- Left: Bold Minimalist Typography & Identity System -->
  <text x="70" y="110" fill="#a855f7" font-family="'Space Grotesk', sans-serif" font-size="12" letter-spacing="4" font-weight="bold">BRAND IDENTITY ARCHITECTURE</text>
  <text x="70" y="170" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">VELOCITY</text>
  <text x="70" y="210" fill="url(#gold)" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="300" letter-spacing="8">AUTOMOTIVE</text>
  
  <text x="70" y="260" fill="#94a3b8" font-family="sans-serif" font-size="13" width="280">
    <tspan x="70" dy="0">Comprehensive brand design system,</tspan>
    <tspan x="70" dy="20">custom automotive logotypes, typography</tspan>
    <tspan x="70" dy="20">hierarchies &amp; minimalist livery guidelines.</tspan>
  </text>

  <!-- Color Palette Swatches -->
  <g transform="translate(70, 350)">
    <rect x="0" y="0" width="36" height="36" rx="4" fill="#090d16" stroke="#334155"/>
    <rect x="46" y="0" width="36" height="36" rx="4" fill="#00f0ff" stroke="#334155"/>
    <rect x="92" y="0" width="36" height="36" rx="4" fill="#ff5500" stroke="#334155"/>
    <rect x="138" y="0" width="36" height="36" rx="4" fill="#ffd700" stroke="#334155"/>
    <text x="0" y="55" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">COLOR TOKEN SYSTEM // HEX #00F0FF</text>
  </g>

  <!-- Right: Stylized Automotive Vector Emblem Artwork -->
  <g transform="translate(560, 260)">
    <!-- Concentric Golden Circles -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#2e1065" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="105" fill="#13082b" stroke="url(#purpleNeon)" stroke-width="2"/>
    
    <!-- Dynamic Speed Wings / Apex Monogram -->
    <path d="M-60 -40 L40 -40 L60 -10 L-40 -10 Z" fill="url(#gold)"/>
    <path d="M-40 0 L60 0 L40 30 L-60 30 Z" fill="url(#purpleNeon)"/>
    <path d="M-20 40 L40 40 L20 60 L-40 60 Z" fill="url(#gold)"/>

    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <text x="70" y="445" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">FIRST PRIZE // INTER-COLLEGE DESIGN CONCLAVE // SHIVRAJ SINGH CHOUHAN</text>
</svg>
