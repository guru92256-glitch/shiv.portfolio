<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="neonRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#d99b75"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162238"/>
      <stop offset="100%" stop-color="#090f1a"/>
    </linearGradient>
    <filter id="glowAvatar">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#avatarBg)"/>

  <!-- Rotating Gear / Engineering Halo in Background -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="230" fill="none" stroke="#17273d" stroke-width="2" stroke-dasharray="10,6"/>
    <circle cx="0" cy="0" r="215" fill="none" stroke="url(#neonRing)" stroke-width="3" filter="url(#glowAvatar)"/>
    <circle cx="0" cy="0" r="195" fill="#080e18" stroke="#1d3452" stroke-width="1.5"/>

    <!-- Subtle CAD Crosshairs and Coordinates -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4,8" opacity="0.4"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4,8" opacity="0.4"/>

    <!-- 12 Compass Tick Marks -->
    <circle cx="0" cy="-215" r="4" fill="#00f0ff"/>
    <circle cx="215" cy="0" r="4" fill="#00f0ff"/>
    <circle cx="0" cy="215" r="4" fill="#00f0ff"/>
    <circle cx="-215" cy="0" r="4" fill="#00f0ff"/>
  </g>

  <!-- Stylized Modern Portrait Silhouette & Illustration -->
  <g transform="translate(300, 310)">
    <!-- Shoulders & Engineering Dark Jacket -->
    <path d="M-150 190 
             C-145 130 -100 85 -55 75 
             L-30 110 L30 110 L55 75 
             C100 85 145 130 150 190 Z" 
          fill="url(#suit)" stroke="#00f0ff" stroke-width="2"/>
    
    <!-- Lapels and Collar -->
    <path d="M-55 75 L-25 150 L-5 160 L-30 85 Z" fill="#1f314d"/>
    <path d="M55 75 L25 150 L5 160 L30 85 Z" fill="#1f314d"/>
    <!-- Crisp Shirt Collar -->
    <polygon points="-25,110 0,145 -12,165 -35,115" fill="#e2e8f0"/>
    <polygon points="25,110 0,145 12,165 35,115" fill="#f8fafc"/>
    <polygon points="-8,145 0,185 8,145 0,140" fill="#00f0ff"/> <!-- Cyber Blue Tie -->

    <!-- Neck -->
    <rect x="-30" y="20" width="60" height="70" rx="10" fill="url(#skin)"/>
    <path d="M-30 65 Q0 90 30 65 Z" fill="#b97c55" opacity="0.5"/>

    <!-- Head / Jawline -->
    <path d="M-65 -40 
             C-65 -15 -55 35 -20 65 
             Q0 75 20 65 
             C55 35 65 -15 65 -40 
             C65 -90 50 -120 0 -120 
             C-50 -120 -65 -90 -65 -40 Z" 
          fill="url(#skin)"/>

    <!-- Ears -->
    <ellipse cx="-67" cy="-25" rx="10" ry="20" fill="#d99b75"/>
    <ellipse cx="67" cy="-25" rx="10" ry="20" fill="#d99b75"/>

    <!-- Modern Styled Hair -->
    <path d="M-72 -50 
             C-70 -115 -40 -150 0 -150 
             C45 -150 78 -110 72 -45 
             C65 -75 40 -110 -5 -110 
             C-50 -110 -65 -80 -72 -50 Z" 
          fill="#111827"/>
    <path d="M-65 -90 C-40 -140 30 -145 65 -100 C40 -125 -20 -125 -65 -90 Z" fill="#1f2937"/>

    <!-- Eyes, Eyebrows & Smart Expression -->
    <!-- Eyebrows -->
    <path d="M-50 -48 Q-30 -58 -10 -48" stroke="#111827" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M50 -48 Q30 -58 10 -48" stroke="#111827" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    
    <!-- Eyes -->
    <ellipse cx="-30" cy="-32" rx="10" ry="6" fill="#ffffff"/>
    <circle cx="-29" cy="-32" r="5" fill="#1e293b"/>
    <circle cx="-27" cy="-34" r="1.8" fill="#ffffff"/>

    <ellipse cx="30" cy="-32" rx="10" ry="6" fill="#ffffff"/>
    <circle cx="29" cy="-32" r="5" fill="#1e293b"/>
    <circle cx="31" cy="-34" r="1.8" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M0 -35 L-4 5 L6 5" stroke="#b97c55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Confident Smile -->
    <path d="M-22 25 Q0 40 22 25" stroke="#92502f" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- High-Tech Engineering HUD Glasses / Monocle Display (Subtle Hologram) -->
    <rect x="-56" y="-45" width="48" height="26" rx="6" fill="none" stroke="#00f0ff" stroke-width="1.8" filter="url(#glowAvatar)"/>
    <rect x="8" y="-45" width="48" height="26" rx="6" fill="none" stroke="#00f0ff" stroke-width="1.8" filter="url(#glowAvatar)"/>
    <line x1="-8" y1="-32" x2="8" y2="-32" stroke="#00f0ff" stroke-width="2"/>
    <line x1="-56" y1="-32" x2="-68" y2="-30" stroke="#00f0ff" stroke-width="1.5"/>
    <line x1="56" y1="-32" x2="68" y2="-30" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="-50" cy="-40" r="1.5" fill="#00f0ff"/>
    <text x="14" y="-38" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="5" opacity="0.8">SYS.OK</text>
  </g>

  <!-- Bottom Floating Hologram Badge -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#0a121e" stroke="#00f0ff" stroke-width="1.5" filter="url(#glowAvatar)"/>
    <circle cx="-110" cy="0" r="5" fill="#00ff88" filter="url(#glowAvatar)"/>
    <text x="-95" y="5" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" letter-spacing="1">SHIVRAJ SINGH CHOUHAN</text>
    <text x="0" y="32" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="2">B.TECH MECHANICAL // JECRC</text>
  </g>
</svg>
